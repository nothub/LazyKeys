plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'idea'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

base {
    archivesName = mod_id
}

// Not a Gradle module -- plain .java files each loader compiles on its own
// classpath, so code shared between loaders that still touches Minecraft
// classes (unlike common/, which is loader-agnostic) doesn't need its own
// Minecraft dependency wired up.
sourceSets.main.java.srcDir "${rootDir}/shared/src/main/java"

dependencies {
    implementation project(':common')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // Dev-run FML module classloading only sees classes merged into this mod's
            // source sets here -- unlike the shipped jar, it does not fall back to the
            // plain runtime classpath, so common's output has to be added explicitly too.
            sourceSet(project(':common').sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
// Also re-run on IDE project sync, not just gradle build.
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def artifactName(String type, String fileExt) {
    return "${rootProject.name}-${project.version}+${project.minecraft_version}-${type}.${fileExt}"
}

jar {
    from("${rootDir}/LICENSE.txt")
    // Bundle common's compiled classes into the shipped jar -- NeoForge does
    // not resolve project() dependencies at runtime, only what's inside the jar.
    from(project(':common').sourceSets.main.output)
}

jar.archiveFileName.set(artifactName('neoforge', 'jar'))
jar.destinationDirectory.set(rootProject.layout.buildDirectory.dir('dist'))

clean {
    delete "${projectDir}/run"
}
